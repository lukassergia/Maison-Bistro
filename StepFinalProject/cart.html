<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Your Cart | Maison Bistro</title>

    <link rel="stylesheet" href="./style.css">

    <script src="./app.js" defer></script>
    <script src="./cart.js" defer></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./auth.js" defer></script>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Maison Bistro</a>

            <button id="menuToggle" aria-label="Toggle menu"
                    aria-expanded="false">☰</button>

            <div id="navMenu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="cart.html">Cart <span id="cartCount">0</span></a>
                <a href="login.html#login" id="loginLink">Login</a>
                <!-- <a href="login.html#register">Join Savora</a> -->

                <span id="userGreeting" hidden></span>
                <button id="logoutButton" hidden>Log out</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <section>
            <h1>Your Cart</h1>
            <p>Review your delicious choices.</p>

            <div id="cartItems">
                <p>Loading cart...</p>
            </div>

            <div class="cart-summary">
                <h2>Total: $<span id="cartTotal">0.00</span></h2>
                <button id="clearCart">Clear Cart</button>
                <button id="checkoutBtn">Checkout</button>
            </div>
        </section>
    </main>
           <h2>Thank You For Your Supporting</h2>
    <footer>
        <p>&copy; <span id="currentYear"></span> Maison Bistro</p>
    </footer>

</body>
</html>
