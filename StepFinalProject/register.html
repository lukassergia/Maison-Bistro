<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Register | Maison Bistro</title>
    <link rel="stylesheet" href="./style.css">
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2" defer></script>
    <script src="./auth.js" defer></script>
    <script src="./register.js" defer></script>
</head>
<body>

    <header>
        <nav>
            <a href="index.html" class="logo">Maison Bistro</a>

            <button id="menuToggle" aria-label="Toggle menu"
                    aria-expanded="false">☰</button>

            <div id="navMenu">
                <a href="index.html">Home</a>
                <a href="menu.html">Menu</a>
                <a href="cart.html">Cart</a>
                <a href="login.html#login" id="loginLink">Login</a>
                <!-- <a href="login.html#register">Join Savora</a> -->

                <span id="userGreeting" hidden></span>
                <button id="logoutButton" hidden>Log out</button>
            </div>
        </nav>
    </header>

    <main class="container">
        <section>
            <h1>Create an Account</h1>
            <p>Join Maison Bistro and enjoy your favorite dishes.</p>

            <form id="registerForm">
                <label for="name">Full Name</label>
                <input type="text" id="name" required>

                <label for="email">Email</label>
                <input type="email" id="email" required>

                <label for="password">Password</label>
                <input type="password" id="password"
                       minlength="6" required>

                <button type="submit">Register</button>

                <p id="registerMessage"></p>
            </form>

            <p>Already have an account?
                <a href="login.html">Login here</a>
            </p>
        </section>
    </main>
             <h2>Thank You For Your Supporting</h2>
    <footer>
        <p>&copy; <span id="currentYear"></span> Maison Bistro</p>
    </footer>

</body>
</html>
